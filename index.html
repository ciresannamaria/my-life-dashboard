<!doctype html>

<title>My Life — Personal Dashboard</title>
<style>
:root{--espresso:#49352b;--mocha:#795c49;--latte:#a88c73;--capp:#d6c2aa;--cream:#f5efe6;--paper:#fffdf9;--ink:#30251f;--muted:#8b7c70;--line:#e9dfd3;--sage:#87917a;--rose:#c58f7c;--gold:#c49a5b;--shadow:0 12px 34px rgba(73,53,43,.07)}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button{font:inherit}.app{min-height:100vh;display:grid;grid-template-columns:250px 1fr}.sidebar{background:var(--espresso);color:#f7f0e8;padding:30px 20px;display:flex;flex-direction:column;gap:38px}.brand{display:flex;align-items:center;gap:12px;padding:0 10px}.brand-mark{width:39px;height:39px;border-radius:14px;background:#d6c2aa;color:var(--espresso);display:grid;place-items:center;font-family:Georgia,serif;font-size:23px}.brand-name{font-family:Georgia,serif;font-size:21px;letter-spacing:.2px}.brand-sub{font-size:10px;color:#cbb9a8;letter-spacing:1.8px;text-transform:uppercase;margin-top:3px}.nav-label{font-size:10px;text-transform:uppercase;letter-spacing:1.7px;color:#b8a392;padding:0 12px;margin-bottom:10px}.nav{display:grid;gap:6px}.nav a{color:#d9cbbf;text-decoration:none;padding:12px;border-radius:12px;display:flex;align-items:center;gap:12px;font-size:13px;transition:.2s}.nav a:hover,.nav a.active{background:#654c3c;color:#fff}.nav .ico{width:19px;text-align:center;font-size:16px}.sidebar-note{margin-top:auto;border:1px solid #735a48;border-radius:16px;padding:16px;background:#533e31}.sidebar-note small{color:#cbb9a8;font-size:10px;text-transform:uppercase;letter-spacing:1.4px}.sidebar-note p{font-family:Georgia,serif;font-size:17px;line-height:1.4;margin:9px 0 0;color:#f5eadd}.main{padding:34px clamp(22px,4vw,58px) 50px;max-width:1600px;width:100%;margin:auto}.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:32px}.eyebrow{font-size:11px;letter-spacing:1.7px;text-transform:uppercase;color:var(--latte);font-weight:700}.date{font-size:12px;color:var(--muted);margin-top:6px}.top-actions{display:flex;align-items:center;gap:12px}.search{background:rgba(255,253,249,.7);border:1px solid var(--line);border-radius:30px;padding:10px 15px;color:var(--muted);font-size:12px;min-width:180px}.avatar{width:38px;height:38px;border-radius:50%;background:var(--capp);color:var(--espresso);display:grid;place-items:center;font-family:Georgia,serif;font-weight:700}.welcome{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:25px}.welcome h1{font-family:Georgia,serif;font-size:clamp(32px,4vw,48px);font-weight:400;letter-spacing:-1.3px;margin:7px 0 8px;color:var(--espresso)}.welcome p{color:var(--muted);font-size:13px;margin:0}.welcome-tag{background:#e9dfd3;color:var(--mocha);padding:10px 15px;border-radius:30px;font-size:11px;white-space:nowrap}.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:18px}.card{background:var(--paper);border:1px solid rgba(214,194,170,.5);border-radius:19px;padding:21px;box-shadow:var(--shadow)}.span-3{grid-column:span 3}.span-4{grid-column:span 4}.span-5{grid-column:span 5}.span-7{grid-column:span 7}.span-8{grid-column:span 8}.span-12{grid-column:span 12}.metric{min-height:142px;position:relative;overflow:hidden}.metric:after{content:"";position:absolute;width:95px;height:95px;border-radius:50%;right:-25px;bottom:-38px;background:var(--tint,#eee5da);opacity:.8}.metric-top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:11px}.metric-icon{width:31px;height:31px;border-radius:11px;background:var(--tint,#eee5da);display:grid;place-items:center;font-size:15px}.metric-value{font-family:Georgia,serif;font-size:29px;color:var(--espresso);margin:15px 0 3px}.metric-foot{font-size:11px;color:var(--muted)}.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:17px}.section-head h2{font-family:Georgia,serif;font-size:20px;font-weight:400;color:var(--espresso);margin:0}.subtle-link{font-size:11px;color:var(--latte);text-decoration:none}.subtle-link:hover{color:var(--espresso)}.week{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;align-items:end;height:150px;padding-top:10px}.day{text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}.bar-wrap{height:105px;width:100%;display:flex;align-items:flex-end;justify-content:center}.bar{width:min(25px,70%);border-radius:8px 8px 4px 4px;background:#d9c8b5;min-height:10px}.day:nth-child(2) .bar,.day:nth-child(5) .bar{background:#a88c73}.day:nth-child(4) .bar{background:#87917a}.day strong{font-size:10px;color:var(--muted);font-weight:500}.day small{font-size:9px;color:#b1a398}.agenda{display:grid;gap:13px}.agenda-row{display:grid;grid-template-columns:54px 10px 1fr;gap:12px;align-items:center}.agenda-time{font-size:10px;color:var(--muted)}.agenda-dot{width:8px;height:8px;border-radius:50%;background:var(--latte);box-shadow:0 0 0 4px #f1e9df}.agenda-copy{border-bottom:1px solid #f0e9e1;padding:0 0 12px}.agenda-copy strong{display:block;font-size:12px;font-weight:600;color:var(--espresso)}.agenda-copy small{font-size:10px;color:var(--muted)}.module-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.module{border:1px solid var(--line);border-radius:15px;padding:15px;background:#fffdfa;min-height:130px;transition:.2s}.module:hover{transform:translateY(-2px);border-color:var(--capp)}.module-icon{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;margin-bottom:13px;font-size:16px}.module h3{font-size:12px;margin:0 0 5px;color:var(--espresso)}.module p{font-size:10px;line-height:1.5;color:var(--muted);margin:0}.quote{background:#ede4d9;border:0;display:flex;flex-direction:column;justify-content:center;min-height:190px}.quote-mark{font-family:Georgia,serif;font-size:34px;color:var(--latte);line-height:1}.quote p{font-family:Georgia,serif;font-size:19px;line-height:1.5;color:var(--espresso);margin:8px 0}.quote small{font-size:10px;color:var(--mocha);letter-spacing:1.3px;text-transform:uppercase}.goal{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid #f0e9e1}.goal:last-child{border:0;padding-bottom:0}.goal-icon{width:34px;height:34px;border-radius:12px;background:#f1e9df;display:grid;place-items:center}.goal-text{flex:1}.goal-text strong{font-size:12px;display:block;color:var(--espresso)}.goal-text small{font-size:10px;color:var(--muted)}.progress{height:5px;background:#eee6dc;border-radius:8px;margin-top:7px;overflow:hidden}.progress i{height:100%;display:block;border-radius:8px;background:var(--sage)}.goal-pct{font-size:10px;color:var(--muted)}.footer{text-align:center;color:#aa9a8c;font-size:10px;margin-top:27px;letter-spacing:.4px}
@media(max-width:1100px){.app{grid-template-columns:210px 1fr}.span-3{grid-column:span 6}.module-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:760px){.app{display:block}.sidebar{position:fixed;left:0;right:0;bottom:0;z-index:50;padding:7px 5px calc(7px + env(safe-area-inset-bottom));gap:0;border-radius:18px 18px 0 0;box-shadow:0 -8px 28px rgba(48,37,31,.16)}.brand{display:none}.sidebar>div:nth-child(2){width:100%}.nav-label,.sidebar-note{display:none}.nav{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;overflow:visible}.nav a{min-width:0;min-height:52px;white-space:normal;padding:7px 1px 6px;font-size:8px;line-height:1.15;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:4px;text-align:center;border-radius:11px}.nav a.active{background:#654c3c;color:#fff}.nav .ico{width:auto;font-size:17px;line-height:1}.main{padding:22px 14px calc(105px + env(safe-area-inset-bottom))}.topbar{margin-bottom:20px}.topbar .date{font-size:16px}.holiday-panel{padding:17px 18px;border-radius:16px}.holiday-count{font-size:29px}.holiday-detail{font-size:10px}.search{display:none}.avatar{width:35px;height:35px}.welcome{align-items:flex-start;flex-direction:column;margin-bottom:20px}.welcome h1{font-size:34px}.welcome p{font-size:12px;line-height:1.55;max-width:330px}.welcome-tag{display:none}.grid{gap:12px}.span-3,.span-4,.span-5,.span-7,.span-8{grid-column:span 12}.module-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.card{padding:16px;border-radius:17px}.metric{min-height:124px}.metric-value{font-size:27px;margin-top:12px}.section-head h2{font-size:19px}.week{gap:5px;height:140px}.bar-wrap{height:96px}.bar{width:19px}.agenda{gap:11px}.module{min-height:120px;padding:13px}.module h3{font-size:11px}.module p{font-size:10px}.quote{min-height:150px}.goal{gap:10px}.goal-text strong{font-size:11px}.footer{font-size:9px}}
@media(max-width:380px){.module-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.nav a{font-size:7px}.nav .ico{font-size:16px}.main{padding-left:11px;padding-right:11px}.card{padding:14px}}
@media(min-width:761px){.sidebar{position:sticky;top:0;height:100vh}}
html{scroll-behavior:smooth;scroll-padding-top:18px}a,button{-webkit-tap-highlight-color:transparent}.nav a:focus-visible{outline:2px solid var(--capp);outline-offset:2px}
.date-heading{display:flex;flex-direction:column;gap:5px}.topbar{margin-bottom:26px}.topbar .date{font-size:17px;color:var(--espresso);font-weight:600;letter-spacing:.2px;margin:0}.week-number{font-size:11px;color:var(--muted)}.overview-content{display:block;max-width:620px}.holiday-panel{background:#ede4d9;border:1px solid rgba(214,194,170,.55);border-radius:18px;padding:20px 23px;box-shadow:var(--shadow);display:flex;align-items:center;gap:15px;min-height:0}.holiday-symbol{width:36px;height:36px;flex:0 0 36px;border-radius:12px;background:#dfcfbd;color:var(--mocha);display:grid;place-items:center;font-size:18px}.holiday-count{font-family:Georgia,serif;font-size:clamp(27px,3vw,34px);color:var(--espresso);margin:7px 0 0;letter-spacing:-.6px}.holiday-detail{font-size:11px;color:var(--muted);margin-top:7px}
@media(max-width:760px){.main{padding-top:24px}.topbar{margin-bottom:28px}.page-heading{margin:0 0 22px}.page-heading h1{font-size:36px}.overview-content{grid-template-columns:1fr;gap:13px}.date-panel,.holiday-panel{min-height:0;padding:22px;border-radius:18px}.today-date{font-size:42px;margin:12px 0 4px}.holiday-count{font-size:38px}.holiday-panel{gap:14px}.holiday-symbol{width:38px;height:38px;flex-basis:38px}}
@media(min-width:761px){.overview-content{grid-template-columns:minmax(280px,.9fr) minmax(360px,1.1fr)}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="brand"><div class="brand-mark">m.</div><div><div class="brand-name">my life</div><div class="brand-sub">a personal space</div></div></div>
  <div><div class="nav-label">Workspace</div><nav class="nav" aria-label="Main navigation">
    <a class="active" href="#overview"><span class="ico">⌂</span>Overview</a>
    <a href="#wellbeing"><span class="ico">✧</span>Wellbeing</a>
    <a href="#nutrition"><span class="ico">◒</span>Nutrition</a>
    <a href="#finances"><span class="ico">◇</span>Finances</a>
    <a href="#habits"><span class="ico">↗</span>Habits & goals</a>
    <a href="#learning"><span class="ico">▤</span>Learning</a>
    <a href="#journal"><span class="ico">✎</span>Journal</a>
  </nav></div>
  
</aside>
<main class="main">
  <header class="topbar">
    <div class="date-heading">
      <div class="date" id="today-long">08.11.2026</div>
      <div class="week-number" id="week-number-top">Week 45</div>
    </div>
    <div class="top-actions"><div class="avatar">A</div></div>
  </header>
  <section id="overview-content" class="overview-content" aria-label="Next holidays">
    <article class="holiday-panel">
      <div class="holiday-symbol">✧</div>
      <div class="holiday-copy">
        <div class="eyebrow">Next holidays</div>
        <div class="holiday-count"><span id="holiday-days">34</span> days left</div>
        <div class="holiday-detail" id="holiday-detail">12.12.2026 · Calendar days, weekends included</div>
      </div>
    </article>
  </section>
</main>
</div>
<script>
const pageNames={overview:"Overview",wellbeing:"Wellbeing",nutrition:"Nutrition",finances:"Finances",habits:"Habits & goals",learning:"Learning",journal:"Journal"};
const navLinks=[...document.querySelectorAll('.nav a')];
function showPage(key){
  const safeKey=pageNames[key]?key:"overview";
  document.getElementById('page-title').textContent=pageNames[safeKey];
  document.getElementById('overview-content').hidden=safeKey!=="overview";
  navLinks.forEach(link=>{const active=link.getAttribute('href')==="#"+safeKey;link.classList.toggle('active',active);if(active)link.setAttribute('aria-current','page');else link.removeAttribute('aria-current')});
}
navLinks.forEach(link=>link.addEventListener('click',event=>{event.preventDefault();const key=link.getAttribute('href').slice(1);history.replaceState(null,"","#"+key);showPage(key)}));
function isoWeek(date){const d=new Date(Date.UTC(date.getFullYear(),date.getMonth(),date.getDate()));const day=d.getUTCDay()||7;d.setUTCDate(d.getUTCDate()+4-day);const yearStart=new Date(Date.UTC(d.getUTCFullYear(),0,1));return Math.ceil((((d-yearStart)/86400000)+1)/7)}
function formatDate(date){return new Intl.DateTimeFormat('en-GB',{day:'2-digit',month:'2-digit',year:'numeric'}).format(date)}
function updateDate(){
  const now=new Date();const target=new Date(2026,11,12);const todayMidnight=new Date(now.getFullYear(),now.getMonth(),now.getDate());const targetMidnight=new Date(target.getFullYear(),target.getMonth(),target.getDate());const days=Math.max(0,Math.ceil((targetMidnight-todayMidnight)/86400000));
  document.getElementById('today-date').textContent=formatDate(now);
  document.getElementById('today-long').textContent=formatDate(now);
  document.getElementById('week-number-top').textContent='Week '+isoWeek(now);
  document.getElementById('holiday-days').textContent=days;
  document.getElementById('holiday-detail').textContent=formatDate(target)+' · calendar days, weekends included';
}
updateDate();showPage(location.hash.slice(1)||"overview");
if ('serviceWorker' in navigator && location.protocol !== 'file:') { window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {})); }
</script>
</body>
</html>
